<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutas y Horarios | Andesbus</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="../../index.html" class="logo">
      <img class="logo-icon" src="../../assets/logo.svg" alt="Andesbus" width="38" height="38"> Andesbus
    </a>
    <button class="menu-toggle" aria-label="Menú">☰</button>
    <div class="nav-links">
      <a href="../../index.html" data-i18n="nav.inicio">Inicio</a>
      <a href="../publica/nosotros.html" data-i18n="nav.nosotros">Nosotros</a>
      <a href="rutas.html" class="activo" data-i18n="nav.rutas">Rutas y Horarios</a>
      <a href="reservas.html" id="enlace-reserva" data-i18n="nav.reservar">Reservar</a>
      <a href="../publica/contacto.html" data-i18n="nav.contacto">Contacto</a>
      <a href="login.html" id="enlace-login" data-i18n="nav.login">Iniciar sesión</a>
      <a href="registro.html" class="boton-nav" id="enlace-registro" data-i18n="nav.registro">Crear cuenta</a>
      <a href="#" id="enlace-salir" style="display:none;" data-i18n="nav.salir">Salir</a>
    </div>
  </nav>

  <main class="contenido">
    <section class="seccion-titulo texto-centro">
      <h1 data-i18n="rutas.titulo">Rutas y horarios</h1>
      <p data-i18n="rutas.sub">Encuentra el viaje perfecto para ti.</p>
    </section>

    <form class="buscar-form" id="form-buscar">
      <div class="form-grupo" style="margin-bottom:0;">
        <label for="origen" data-i18n="rutas.origen">Origen</label>
        <input type="text" id="origen" placeholder="Ej. Lima" data-i18n-ph="rutas.origenPh" list="lista-ciudades">
      </div>
      <div class="form-grupo" style="margin-bottom:0;">
        <label for="destino" data-i18n="rutas.destino">Destino</label>
        <input type="text" id="destino" placeholder="Ej. Cusco" data-i18n-ph="rutas.destinoPh" list="lista-ciudades">
      </div>
      <div class="form-grupo" style="margin-bottom:0;">
        <label for="fecha" data-i18n="rutas.fecha">Fecha</label>
        <input type="date" id="fecha">
      </div>
      <button type="submit" class="btn btn-azul" data-i18n="rutas.buscar">Buscar</button>
      <datalist id="lista-ciudades"></datalist>
    </form>

    <section id="resultados"></section>
  </main>

  <footer>
    <p data-i18n="footer.copy">© 2026 Andesbus - Todos los derechos reservados</p>
  </footer>

  <script src="../../js/core/i18n.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/datos.js"></script>
  <script src="../../js/cliente/rutas.js"></script>
  <script src="../../js/core/main.js"></script>
</body>
</html>
