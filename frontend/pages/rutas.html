<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutas y Horarios | TransRápido</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="logo">
      <span class="logo-icon">🚌</span> TransRápido
    </a>
    <button class="menu-toggle" aria-label="Menú">☰</button>
    <div class="nav-links">
      <a href="../index.html">Inicio</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="rutas.html" class="activo">Rutas y Horarios</a>
      <a href="reservas.html" id="enlace-reserva">Reservar</a>
      <a href="contacto.html">Contacto</a>
      <a href="login.html" id="enlace-login">Iniciar sesión</a>
      <a href="registro.html" class="boton-nav">Crear cuenta</a>
      <a href="#" id="enlace-salir" style="display:none;">Salir</a>
    </div>
  </nav>

  <main class="contenido">
    <section class="seccion-titulo texto-centro">
      <h1>Rutas y horarios</h1>
      <p>Encuentra el viaje perfecto para ti.</p>
    </section>

    <form class="buscar-form" id="form-buscar">
      <div class="form-grupo" style="margin-bottom:0;">
        <label for="origen">Origen</label>
        <input type="text" id="origen" placeholder="Ej. Lima" list="lista-ciudades">
      </div>
      <div class="form-grupo" style="margin-bottom:0;">
        <label for="destino">Destino</label>
        <input type="text" id="destino" placeholder="Ej. Cusco" list="lista-ciudades">
      </div>
      <div class="form-grupo" style="margin-bottom:0;">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha">
      </div>
      <button type="submit" class="btn btn-azul">Buscar</button>
      <datalist id="lista-ciudades"></datalist>
    </form>

    <section id="resultados"></section>
  </main>

  <footer>
    <p>© 2026 TransRápido - Todos los derechos reservados</p>
  </footer>

  <script src="../js/auth.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/rutas.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
