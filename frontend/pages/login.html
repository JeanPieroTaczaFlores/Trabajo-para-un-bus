<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | TransRápido</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="logo">
      <span class="logo-icon">🚌</span> TransRápido
    </a>
    <button class="menu-toggle" aria-label="Menú">☰</button>
    <div class="nav-links">
      <a href="../index.html">Inicio</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="rutas.html">Rutas y Horarios</a>
      <a href="reservas.html" id="enlace-reserva">Reservar</a>
      <a href="contacto.html">Contacto</a>
      <a href="login.html" class="activo">Iniciar sesión</a>
      <a href="registro.html" class="boton-nav">Crear cuenta</a>
      <a href="#" id="enlace-salir" style="display:none;">Salir</a>
    </div>
  </nav>

  <main class="contenido">
    <div class="form-caja">
      <h2>Iniciar sesión</h2>
      <p class="subtitulo">Accede para reservar tus viajes.</p>
      <div class="alert alert-error" id="alerta"></div>
      <form id="form-login" novalidate>
        <div class="form-grupo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" placeholder="tucorreo@ejemplo.com" autocomplete="email">
          <div class="mensaje-error" id="error-correo">Ingresa un correo válido.</div>
        </div>
        <div class="form-grupo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" placeholder="Tu contraseña" autocomplete="current-password">
          <div class="mensaje-error" id="error-contrasena">Ingresa tu contraseña.</div>
        </div>
        <button type="submit" class="btn btn-azul btn-bloque">Entrar</button>
      </form>
      <p class="texto-centro mt-16">¿No tienes cuenta? <a href="registro.html" style="color:var(--naranja);font-weight:600;">Regístrate aquí</a></p>
    </div>
  </main>

  <footer>
    <p>© 2026 TransRápido - Todos los derechos reservados</p>
  </footer>

  <script src="../js/auth.js"></script>
  <script src="../js/login.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
