<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Andesbus</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="logo">
      <img class="logo-icon" src="../assets/logo.svg" alt="Andesbus" width="38" height="38"> Andesbus
    </a>
    <button class="menu-toggle" aria-label="Menú">☰</button>
    <div class="nav-links">
      <a href="../index.html" data-i18n="nav.inicio">Inicio</a>
      <a href="nosotros.html" data-i18n="nav.nosotros">Nosotros</a>
      <a href="rutas.html" data-i18n="nav.rutas">Rutas y Horarios</a>
      <a href="reservas.html" id="enlace-reserva" data-i18n="nav.reservar">Reservar</a>
      <a href="contacto.html" data-i18n="nav.contacto">Contacto</a>
      <a href="login.html" class="activo" data-i18n="nav.login">Iniciar sesión</a>
      <a href="registro.html" class="boton-nav" id="enlace-registro" data-i18n="nav.registro">Crear cuenta</a>
      <a href="#" id="enlace-salir" style="display:none;" data-i18n="nav.salir">Salir</a>
    </div>
  </nav>

  <main class="contenido">
    <div class="form-caja">
      <h2 data-i18n="login.titulo">Iniciar sesión</h2>
      <p class="subtitulo" data-i18n="login.sub">Accede para reservar tus viajes.</p>
      <div class="alert alert-error" id="alerta"></div>
      <form id="form-login" novalidate>
        <div class="form-grupo">
          <label for="correo" data-i18n="login.correo">Correo electrónico</label>
          <input type="email" id="correo" placeholder="tucorreo@ejemplo.com" data-i18n-ph="login.correoPh" autocomplete="email">
          <div class="mensaje-error" id="error-correo" data-i18n="login.errCorreo">Ingresa un correo válido.</div>
        </div>
        <div class="form-grupo">
          <label for="contrasena" data-i18n="login.pass">Contraseña</label>
          <input type="password" id="contrasena" placeholder="Tu contraseña" data-i18n-ph="login.passPh" autocomplete="current-password">
          <div class="mensaje-error" id="error-contrasena" data-i18n="login.errPass">Ingresa tu contraseña.</div>
        </div>
        <button type="submit" class="btn btn-azul btn-bloque" data-i18n="login.entrar">Entrar</button>
      </form>
      <p class="texto-centro mt-16"><span data-i18n="login.nocuenta">¿No tienes cuenta?</span> <a href="registro.html" style="color:var(--naranja);font-weight:600;" data-i18n="login.registrate">Regístrate aquí</a></p>
    </div>
  </main>

  <footer>
    <p data-i18n="footer.copy">© 2026 Andesbus - Todos los derechos reservados</p>
  </footer>

  <script src="../js/i18n.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/login.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
